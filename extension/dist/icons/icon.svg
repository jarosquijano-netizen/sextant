<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#1e3a5f"/>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#2d5282" stroke-width="3"/>

  <!-- North needle (white, sharp) -->
  <polygon points="64,14 70,62 64,57 58,62" fill="#ffffff"/>
  <!-- South needle (amber, sharp) -->
  <polygon points="64,114 58,66 64,71 70,66" fill="#f59e0b"/>

  <!-- East needle (slate) -->
  <polygon points="114,64 66,58 71,64 66,70" fill="#94a3b8"/>
  <!-- West needle (slate) -->
  <polygon points="14,64 62,70 57,64 62,58" fill="#94a3b8"/>

  <!-- Cardinal tick marks -->
  <line x1="64" y1="8"  x2="64" y2="18"  stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="110" x2="64" y2="120" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8"  y1="64" x2="18"  y2="64" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="64" x2="120" y2="64" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="64" cy="64" r="8" fill="#1e3a5f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="64" cy="64" r="3" fill="#f59e0b"/>
</svg>
